<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <title>本本的私人订阅</title>
  <meta name="description" content="私人免费节点订阅，每小时自动更新。仅供自己使用。">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background: #0a0a0d; color: #e4e4e7; }
    .bg-mesh {
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .card-glow {
      position: relative;
      background: linear-gradient(145deg, #16161b 0%, #121216 100%);
      box-shadow: 0 4px 24px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
    }
    .card-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(6,182,212,0.2), transparent 45%, transparent 70%, rgba(6,182,212,0.06));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .page-btn {
      min-width: 2.25rem;
      padding: 0.5rem 0.6rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      font-size: 0.875rem;
      color: #d4d4d8;
    }
    .page-btn:disabled { opacity: 0.35; }
    .page-btn.active {
      border-color: rgba(6,182,212,0.5);
      background: rgba(6,182,212,0.15);
      color: #67e8f9;
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-screen bg-mesh font-sans antialiased" x-data="subPage()" x-init="init()">
  <main class="mx-auto max-w-2xl px-4 py-10">
    <h1 class="text-3xl font-bold">免费配置</h1>
    <p class="mt-2 text-sm text-zinc-400">私人订阅 · 每小时自动更新 · 仅供自己使用</p>

    <div class="card-glow mt-8 rounded-2xl p-5">
      <div class="flex items-center gap-4">
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-cyan-500/10 text-xl font-bold text-cyan-400">1.0</div>
        <div>
          <div class="text-lg font-semibold">订阅 1.0</div>
          <div class="text-sm text-zinc-400">多来源聚合 · 自动去重</div>
        </div>
      </div>

      <button @click="copy(subUrl, 'all')" class="mt-5 flex w-full items-center justify-center gap-2 rounded-xl border border-cyan-500/40 bg-cyan-500/10 px-4 py-3 font-medium text-cyan-300 transition hover:bg-cyan-500/20">
        <i class="fa-regular fa-copy"></i><span x-text="copiedKey === 'all' ? '已复制' : '复制订阅链接'"></span>
      </button>

      <div class="mt-4 flex items-center gap-2 rounded-xl border border-cyan-500/30 bg-cyan-500/5 px-4 py-3">
        <i class="fa-solid fa-server text-cyan-400"></i>
        <span class="text-sm text-zinc-300">订阅中的服务器：</span>
        <span class="text-lg font-bold text-cyan-400" x-text="loading ? '统计中…' : total + ' 台服务器'"></span>
      </div>

      <div class="mt-4 flex flex-wrap gap-2" x-cloak>
        <template x-for="(count, proto) in byProto" :key="proto">
          <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-zinc-300"><span x-text="proto"></span> <span class="font-semibold text-cyan-300" x-text="count"></span></span>
        </template>
      </div>

      <div class="mt-4 break-all rounded-xl bg-black/40 p-3 font-mono text-xs text-zinc-500" x-text="subUrl"></div>
      <p class="mt-3 text-xs text-zinc-500">最近更新：<span x-text="updated || '—'"></span> · 备用链接：<a class="text-cyan-400 underline" :href="rawUrl" target="_blank" rel="noopener">raw.githubusercontent</a></p>
    </div>

    <h2 class="mt-10 text-xl font-bold">分组订阅</h2>
    <p class="mt-1 text-sm text-zinc-400">每组 50 个节点，一次只导一组，测完再换下一组。</p>

    <div x-show="!loading && chunks.length === 0" class="card-glow mt-4 rounded-2xl p-5 text-sm text-zinc-400" x-cloak>分组订阅正在生成，下次更新后出现。</div>

    <div x-show="chunks.length > 0" x-cloak>
      <template x-for="c in pageChunks" :key="c.id">
        <div class="card-glow mt-4 rounded-2xl p-4">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-cyan-500/10 text-base font-bold text-cyan-400" x-text="c.id"></div>
              <div>
                <div class="font-semibold">第 <span x-text="c.id"></span> 组</div>
                <div class="text-xs text-zinc-400"><span x-text="c.count"></span> 台服务器</div>
              </div>
            </div>
            <button @click="copy(chunkUrl(c), 'g' + c.id)" class="flex shrink-0 items-center gap-2 rounded-xl border border-cyan-500/40 bg-cyan-500/10 px-4 py-2 text-sm font-medium text-cyan-300 transition hover:bg-cyan-500/20">
              <i class="fa-regular fa-copy"></i><span x-text="copiedKey === 'g' + c.id ? '已复制' : '复制'"></span>
            </button>
          </div>
          <div class="mt-3 break-all rounded-lg bg-black/40 p-2 font-mono text-xs text-zinc-500" x-text="chunkUrl(c)"></div>
        </div>
      </template>

      <div class="mt-6 flex flex-wrap items-center justify-center gap-2" x-show="totalPages > 1">
        <button class="page-btn" @click="go(page - 1)" :disabled="page === 1">上一页</button>
        <template x-for="p in totalPages" :key="p">
          <button class="page-btn" :class="page === p ? 'active' : ''" @click="go(p)" x-text="p"></button>
        </template>
        <button class="page-btn" @click="go(page + 1)" :disabled="page === totalPages">下一页</button>
      </div>
      <p class="mt-3 text-center text-xs text-zinc-500">第 <span x-text="page"></span> / <span x-text="totalPages"></span> 页 · 共 <span x-text="chunks.length"></span> 组</p>
    </div>

    <p class="mt-8 text-xs leading-relaxed text-zinc-500">用法：复制订阅链接，到 V2Box「配置 → 添加订阅」里粘贴，更新订阅后测速挑能用的连。公开免费节点，别用来登录账号、付款或银行。</p>
  </main>
  <script>
    function subPage() {
      return {
        total: 0, updated: '', byProto: {}, loading: true,
        chunks: [], page: 1, perPage: 10, copiedKey: '',
        base: 'https://cdn.jsdelivr.net/gh/Jiang060202/benben-sub@main/',
        subUrl: 'https://cdn.jsdelivr.net/gh/Jiang060202/benben-sub@main/sub.txt',
        plainUrl: 'https://cdn.jsdelivr.net/gh/Jiang060202/benben-sub@main/sub_plain.txt',
        statsUrl: 'https://cdn.jsdelivr.net/gh/Jiang060202/benben-sub@main/stats.json',
        rawUrl: 'https://raw.githubusercontent.com/Jiang060202/benben-sub/main/sub.txt',
        get totalPages() { return Math.max(1, Math.ceil(this.chunks.length / this.perPage)); },
        get pageChunks() { return this.chunks.slice((this.page - 1) * this.perPage, this.page * this.perPage); },
        chunkUrl(c) { return this.base + c.file; },
        go(p) {
          if (p < 1 || p > this.totalPages) return;
          this.page = p;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        async init() {
          try {
            const s = await (await fetch(this.statsUrl)).json();
            this.updated = (s.updated_utc || '') + ' UTC';
            this.byProto = s.by_protocol || {};
            this.total = s.total || 0;
            this.chunks = s.chunks || [];
          } catch (e) {}
          try {
            const t = await (await fetch(this.plainUrl)).text();
            const n = t.split('\n').filter(x => x.trim()).length;
            if (n) this.total = n;
          } catch (e) {}
          this.loading = false;
        },
        copy(text, key) {
          navigator.clipboard.writeText(text).then(() => {
            this.copiedKey = key;
            setTimeout(() => { if (this.copiedKey === key) this.copiedKey = ''; }, 2000);
          });
        }
      }
    }
  </script>
</body>
</html>
